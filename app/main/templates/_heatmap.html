
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<div id = "heatmap-container"class="chart-container">
        {{ plot_div | safe }} 
</div> 

<div id = "mutation-popup" class="mutation-popup" style = "display: none; position: absolute; background: white; padding: 20px; border: 1px solid #ccc; box-shadow: 0px 4px 10px rgba(0,0,0,0.3); z-index: 1000; border-radius: 8px; width: 650px;">
    <div id="table-container"></div>
    <button onclick="closePopup()" style="cursor: pointer;">Close</button>
    
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
         //find plotly div
         var plot_div = document.querySelector('#heatmap-container .plotly-graph-div');
         if (plot_div) {
            plot_div.on('plotly_click', function(data) {
                var cell = data.points[0];
                var mutationIDs = cell.customdata;
                if (!mutationIDs || mutationIDs === "No mutants" || mutationIDs.length === 0) {
                    return; 
                }
                var mouseX = data.event.pageX;
                var mouseY = data.event.pageY;
                let how_much_left = (mouseX - 325);
                if (how_much_left < 10) {
                    how_much_left = 10;
                }
                var popup = document.getElementById('mutation-popup');
                popup.style.left = how_much_left + "px";
                popup.style.top = (mouseY + 15) + "px";
                //send post request to get-mutations route with the mutationIDs
                fetch('/api/get-mutations', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ids: mutationIDs})
                })
                .then(response => response.json())
                .then(mutationsMap => {
                    // 'mutationsMap' is JSON object returned from backend
                    buildMutationTable(mutationsMap);
                })
                .catch(error => console.error("Error fetching mutation details:", error));
            
            });
         }
    });

    function buildMutationTable(mutationsMap) {
        let tableHtml = `<div class="table-responsive">
                            <table class="table table-striped table-bordered table-hover">
                            <thead class="table-dark">
                                <tr>
                                <th>ID</th>
                                <th>AA mutation</th>
                                <th>BP mutation</th>
                                <th>Species</th>
                                <th>Source</th>
                                </tr>
                            </thead>
                            <tbody>`;
                
                    for (const [mutID, m] of Object.entries(mutationsMap)) {
                    let sourceHTML = m.source.startsWith('http') 
                        ? `<a href="${m.source}" target="_blank">${m.source}</a>` 
                        : m.source; //if condition is true (source starts with http), picks value after '?'. if not, picks value after ':'

                        tableHtml += `<tr>
                            <td>${mutID}</td>
                            <td>${m.aa_mut}</td>
                            <td>${m.bp_mut}</td>
                            <td>${m.species}</td>
                            <td>${sourceHTML}</td>
                            </tr>`;
                    }

                tableHtml += `
                            </tbody>
                        </table>
                    </div>
                `;
                document.getElementById("table-container").innerHTML = tableHtml;
                document.getElementById("mutation-popup").style.display = "block";

    }

    function closePopup() {
    document.getElementById("mutation-popup").style.display = "none";
    }   
</script>
